[project]
name = "catsentry"
version = "0.1.0"
description = "Cat Sentry detection service: video source -> YOLO + ByteTrack cat detections"
readme = "README.md"
authors = [
    { name = "Jaden Stittsworth", email = "jadenrs10@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.123",
]

[project.scripts]
catsentry = "catsentry.cli:main"
catsentry-replay = "catsentry.replay:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "integration: exercises real YOLO inference on a downloaded video fixture; slow, needs network for model weights, skipped by default (run with `-m integration`)",
]
addopts = "-m 'not integration'"
