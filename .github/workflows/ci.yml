name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detection
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: detection/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        # Integration tests (real YOLO inference on a downloaded fixture) are
        # excluded by the default `-m "not integration"` in pyproject.toml --
        # they need model weights + video fixtures pulled over the network,
        # which is too heavy/flaky for CI. Run them locally with:
        #   uv run python scripts/download_fixtures.py && uv run pytest -m integration
        run: uv run pytest
